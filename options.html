<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CrainteAI Settings</title>
  <style>
    :root {
      --primary: #0f172a;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      max-width: 440px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 30px;
      text-align: center;
    }

    .header svg {
      color: var(--primary);
      margin-bottom: 12px;
    }

    .header h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group:last-of-type {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #1e293b;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.1);
    }

    #status {
      color: var(--success);
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <div class="header">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    <h2>CrainteAI Settings</h2>
    <p>Configure your API keys to enable security scanning.</p>
  </div>

  <div class="card">
    <div class="input-group">
      <label>Groq API Key</label>
      <input type="password" id="groqKey" placeholder="gsk_...">
    </div>

    <div class="input-group">
      <label>VirusTotal API Key</label>
      <input type="password" id="vtKey" placeholder="Your VT Key...">
    </div>

    <button id="saveBtn">Save Keys</button>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>

</html>
